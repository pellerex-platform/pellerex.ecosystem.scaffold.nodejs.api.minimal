apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  # NODE-D5 — name matches the .NET minimal contract: *-api-vault.
  name: RepoUniqueNormalisedIdentifier-api-vault
  namespace: <qualityassurance-namespace>
spec:
  provider: azure
  # NODE-D6 — file mount ONLY. No `secretObjects` block (no etcd / env-var exposure).
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<identity-id>"
    keyvaultName: "<qualityassurance-keyvault-name>"
    cloudName: ""
    cloudEnvFileName: ""
    objects: |
      array:
        - |
          objectName: DbConnectionString
          objectAlias: DbConnectionString
          objectType: secret
          objectVersion: ""

    tenantId: "<tenant-id>"
