apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "RepoUniqueNormalisedIdentifier.fullname" . }}
  labels:
    {{- include "RepoUniqueNormalisedIdentifier.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      {{- include "RepoUniqueNormalisedIdentifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        timestamp: "{{ now | date "2006-01-02 15:04:05" }}"
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "RepoUniqueNormalisedIdentifier.selectorLabels" . | nindent 8 }}
        # Stable product identity for the Pellerex portal Infra tab: the marketplace product
        # GUID, substituted at repo-creation time. EngineeringOps matches pods by this label so
        # discovery never depends on the repo / AppSpace naming scheme.
        pellerex.io/product-id: "<marketplace-product-id>"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "RepoUniqueNormalisedIdentifier.serviceAccountName" . }}
      # NODE-D21 — pod-level hardening (runAsNonRoot, fsGroup, seccomp RuntimeDefault).
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          # NODE-D21 — container-level hardening (read-only root FS, drop ALL caps,
          # no privilege escalation).
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            # Writable tmpfs for /tmp so a read-only root filesystem does not break Node.
            - name: tmp
              mountPath: /tmp
            # Writable dir for the daily-rolling file sinks under the read-only root FS.
            - name: log-storage
              mountPath: {{ .Values.logging.directory | quote }}
            {{- if .Values.secretProviderClass.enabled }}
            {{- range $k, $v := .Values.volumeMounts }}
            - name: {{ $v.name | quote }}
              mountPath: {{ $v.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $v.name | quote }}
              value: {{ $v.value | quote }}
            {{- end }}
            {{- range $k, $v := .Values.global.envValuesFrom }}
            - name: {{ $v | quote }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $v | quote }}
            {{- end }}
          ports:
            # NODE-D5 — container binds 8890 (NOT the <port-number> token / 80).
            - name: http
              containerPort: 8890
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        # Ephemeral log dir for the file sinks (complements stdout/App Insights;
        # not the durable store).
        - name: log-storage
          emptyDir: {}
        {{- if .Values.secretProviderClass.enabled }}
        {{- range $k, $v := .Values.volumes }}
        - name: {{ $v.name | quote }}
          {{- if $v.csiSecretProviderClass }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $v.csiSecretProviderClass }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "RepoUniqueNormalisedIdentifier.selectorLabels" . | nindent 14 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
