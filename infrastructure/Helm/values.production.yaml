replicaCount: 2
deploymentStrategy: RollingUpdate

image:
  repository: pellerex/RepoUniqueNormalisedIdentifier
  pullPolicy: Always
  tag: "v1.0.0"

env:
  # NODE-D14 — NODE_ENV=production in every deployed environment (runtime mode).
  - name: "NODE_ENV"
    value: "production"
  # APP_ENV selects config.{env}.json (kept separate from NODE_ENV).
  - name: "APP_ENV"
    value: "production"
  # Port is the <port-number> token, provisioned to the platform port.
  - name: "PORT"
    value: "<port-number>"
  - name: "ContainerMode"
    value: "true"
  - name: "SECRETS_MOUNT_PATH"
    value: "/mnt/secrets-store"

global:
  envValuesFrom:
    Runtime__IpAddress: status.podIP

# NODE-D6 — CSI tmpfs file mount of the Key Vault.
secretProviderClass:
  enabled: <secret-provider-class-enabled>

volumes:
  - name: RepoUniqueNormalisedIdentifier-api-keyvault-volume
    csiSecretProviderClass: RepoUniqueNormalisedIdentifier-api-vault

volumeMounts:
  - name: RepoUniqueNormalisedIdentifier-api-keyvault-volume
    readOnly: true
    mountPath: /mnt/secrets-store

# Writable emptyDir for the daily-rolling file sinks (must match config.{env}.json
# file_directory). emptyDir is ephemeral - files complement stdout/App Insights,
# they are not the durable store.
logging:
  directory: /var/log/app

imagePullSecrets:
  - name: image-pull-secret
nameOverride: ""
fullnameOverride: "<managed-service-name>"

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

# NODE-D21 — pod hardening.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# NODE-D21 — container hardening.
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  # targetPort matches the container port (the <port-number> token).
  targetPort: <port-number>

# NODE-D20 — scale via replicas + resource requests/limits (not the cluster module).
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
