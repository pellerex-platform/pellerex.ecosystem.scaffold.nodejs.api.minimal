trigger:
  - <target-branch>

# Named ubuntu-24.04 rather than ubuntu-latest, like the GitHub build in
# .github/workflows/ci.yaml, until this build has been proven on Ubuntu 26.
pool:
  vmImage: "ubuntu-24.04"

variables:
  - group: PipelineVariables
  - name: projectName
    # Matches the .NET reference artifact identity - the release side consumes this name.
    value: "Pellerex.Ecosystem.ManagedApi.RepoUniqueIdentifier"
  - name: dockerRepositoryName
    value: "pellerex/RepoUniqueNormalisedIdentifier"
  - name: nodeVersion
    value: "22.x"
  - name: feed
    value: "ManagedApiService/External.Latest"

steps:
  - checkout: self
    lfs: true

  - task: NodeTool@0
    displayName: "Use Node.js $(nodeVersion)"
    inputs:
      versionSpec: "$(nodeVersion)"

  # NODE-D21 — install from the committed lockfile (reproducible, supply-chain safe).
  - script: |
      npm ci
    displayName: "npm ci"

  # NODE-R11 — a non-compiling scaffold fails CI here.
  - script: |
      npm run build
    displayName: "nest build"

  - script: |
      npm test
    displayName: "unit tests"

  # NODE-D21 — supply-chain gate: fail the build on a high/critical advisory.
  - script: |
      npm audit --audit-level=high
    displayName: "npm audit (high)"

  - task: CopyFiles@2
    inputs:
      SourceFolder: "infrastructure"
      Contents: "**"
      TargetFolder: "$(Build.ArtifactStagingDirectory)"

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: "$(Build.ArtifactStagingDirectory)"
      artifactName: "$(projectName)"
    displayName: "Upload Artifacts"

  # The image is also tagged with the full commit it was built from, so a release can
  # deploy this build by its own tag and a pod that restarts pulls that same image again,
  # never a newer build. latest and v1.0.0 are still pushed as before.
  - task: Docker@2
    inputs:
      repository: "$(dockerRepositoryName)"
      command: "build"
      Dockerfile: "**/Dockerfile"
      tags: |
        $(Build.SourceVersion)
        latest
        v1.0.0

  # Only the target branch pushes. On every other branch this step is left out of the
  # pipeline, so a run there never asks for the DockerHub connection, which Azure DevOps gives
  # to the target branch alone.
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/<target-branch>') }}:
    - task: Docker@2
      displayName: Push
      inputs:
        command: push
        containerRegistry: "DockerHub"
        repository: "$(dockerRepositoryName)"
        tags: |
          $(Build.SourceVersion)
          latest
          v1.0.0

  # Deployment (`helm upgrade` to AKS) is performed by the platform ReleaseProcess
  # using infrastructure/Helm/values.{env}.yaml + secret-provider-class-{env}.yaml —
  # identical to the .NET/Go scaffolds. It is intentionally NOT duplicated here.
