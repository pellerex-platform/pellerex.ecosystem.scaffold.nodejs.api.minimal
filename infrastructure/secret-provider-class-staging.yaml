apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  # NODE-D5 — name matches the .NET minimal contract: *-api-vault.
  name: RepoUniqueNormalisedIdentifier-api-vault
  namespace: <staging-namespace>
spec:
  provider: azure
  # NODE-D6 — file mount ONLY. No `secretObjects` block: the secret is never synced
  # into a Kubernetes Secret (etcd) and never exposed as an env var. The CSI driver
  # mounts each object as a file (key-per-file) on an in-memory tmpfs volume.
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<identity-id>"
    keyvaultName: "<staging-keyvault-name>"
    cloudName: ""
    cloudEnvFileName: ""
    objects: |
      array:
        - |
          objectName: DbConnectionString
          objectAlias: DbConnectionString
          objectType: secret
          objectVersion: ""

    tenantId: "<tenant-id>"
